    <!-- Title -->
    <text x="20" y="228" font-size="22" font-weight="700" fill="#24292f"># Cálculo II — Límites laterales</text>
    
    <!-- Meta -->
    <g font-size="12" fill="#656d76">
      <text x="20" y="256">**Fecha:** 2026-09-15</text>
      <text x="200" y="256">**Materia:** Cálculo II</text>
      <text x="380" y="256">**Tema:** Límites laterales</text>
      <text x="580" y="256">**Duración:** 47:12</text>
    </g>
    
    <!-- Resumen section -->
    <text x="20" y="296" font-size="16" font-weight="600" fill="#24292f">## Resumen</text>
    <text x="20" y="324" font-size="13" fill="#24292f" style="line-height: 1.6">En esta clase se introdujeron los conceptos fundamentales de <strong>límites laterales</strong> (lado derecho e izquierdo) como herramienta para analizar el comportamiento de funciones cerca de puntos donde no están definidas o presentan discontinuidades. El profesor derivó la definición formal ε-δ para límites unilaterales y demostró el teorema de equivalencia: el límite bilateral existe si y solo si ambos laterales coinciden. Se resolvieron ejercicios típicos con funciones racionales, trigonométricas y a trozos.</text>
    
    <!-- Puntos clave -->
    <text x="20" y="376" font-size="16" font-weight="600" fill="#24292f">## Puntos clave</text>
    <g font-size="13" fill="#24292f">
      <text x="20" y="404">• Definición formal de límite lateral derecho (x → a⁺) e izquierdo (x → a⁻)</text>
      <text x="20" y="428">• Teorema: lim_{x→a} f(x) = L ⟺ lim_{x→a⁺} f(x) = lim_{x→a⁻} f(x) = L</text>
      <text x="20" y="452">• Discontinuidad evitable vs. salto vs. infinita — clasificación por límites laterales</text>
      <text x="20" y="476">• Límite de sin(x)/x cuando x→0⁺ y x→0⁻ (igual a 1)</text>
      <text x="20" y="500">• Funciones a trozos: evaluar cada rama independientemente</text>
    </g>
    
    <!-- Conceptos (wikilinks) -->
    <text x="20" y="540" font-size="16" font-weight="600" fill="#24292f">## Conceptos</text>
    <g font-size="13" fill="#24292f">
      <text x="20" y="568">• <tspan fill="#0969da">[[Límite]]</tspan> — valor al que tiende una función cuando la variable se aproxima a un punto</text>
      <text x="20" y="592">• <tspan fill="#0969da">[[Continuidad]]</tspan> — no hay saltos, huecos ni asíntotas en el punto</text>
      <text x="20" y="616">• <tspan fill="#0969da">[[Discontinuidad de salto]]</tspan> — límites laterales existen pero son distintos</text>
      <text x="20" y="640">• <tspan fill="#0969da">[[Teorema del sándwich]]</tspan> — acotar función entre dos que tienden al mismo límite</text>
    </g>
    
