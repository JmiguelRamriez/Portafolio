<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Terminal window frame -->
  <g transform="translate(100, 80)">
    <!-- Window chrome -->
    <rect x="0" y="0" width="1000" height="640" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    
    <!-- Title bar -->
    <rect x="0" y="0" width="1000" height="36" rx="8" fill="#161b22"/>
    <rect x="0" y="8" width="1000" height="28" fill="#161b22"/>
    
    <!-- Traffic lights -->
    <circle cx="18" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="58" cy="18" r="6" fill="#28ca42"/>
    
    <!-- Title -->
    <text x="500" y="24" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">clase-notes  ·  Rust TUI  ·  Whisper + Ollama</text>
    
    <!-- Main TUI content area -->
    <rect x="16" y="56" width="968" height="568" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    
    <!-- Header bar in TUI -->
    <rect x="16" y="56" width="968" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="36" y="78" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" fill="#e6edf3">🎙  clase-notes</text>
    <text x="220" y="78" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#8b949e">Whisper local + Ollama + Obsidian</text>
    <text x="880" y="78" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#6e7681">F1 Ayuda  ·  Tab Navegar  ·  Esc Salir</text>
    
    <!-- Menu panel (left) -->
    <rect x="24" y="112" width="320" height="496" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="138" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#e6edf3">MENÚ PRINCIPAL</text>
    
    <!-- Menu items -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14">
      <rect x="32" y="160" width="304" height="44" rx="3" fill="#238636" opacity="0.15" stroke="#238636" stroke-width="1"/>
      <text x="52" y="188" fill="#58a6ff">► Grabar clase</text>
      <text x="280" y="188" text-anchor="end" fill="#8b949e">Enter</text>
      
      <rect x="32" y="216" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="244" fill="#e6edf3">Procesar WAV existente</text>
      <text x="280" y="244" text-anchor="end" fill="#8b949e">p</text>
      
      <rect x="32" y="272" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="300" fill="#e6edf3">Ver notas recientes</text>
      <text x="280" y="300" text-anchor="end" fill="#8b949e">n</text>
      
      <rect x="32" y="328" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="356" fill="#e6edf3">Conectar teléfono (QR)</text>
      <text x="280" y="356" text-anchor="end" fill="#8b949e">q</text>
      
      <rect x="32" y="384" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="412" fill="#e6edf3">Verificar entorno (doctor)</text>
      <text x="280" y="412" text-anchor="end" fill="#8b949e">d</text>
      
      <rect x="32" y="440" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="468" fill="#e6edf3">Configuración</text>
      <text x="280" y="468" text-anchor="end" fill="#8b949e">c</text>
      
      <rect x="32" y="496" width="304" height="44" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="524" fill="#e6edf3">Salir</text>
      <text x="280" y="524" text-anchor="end" fill="#8b949e">Esc</text>
    </g>
    
    <!-- Status panel (right-top) -->
    <rect x="360" y="112" width="624" height="240" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="376" y="138" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#e6edf3">ESTADO DEL SISTEMA</text>
    
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#e6edf3">
      <text x="376" y="168">● Ollama:        </text><text x="520" y="168" fill="#3fb950">Conectado (llama3.1:8b)</text>
      <text x="376" y="192">● Whisper:       </text><text x="520" y="192" fill="#3fb950">ggml-medium.bin (GPU: CUDA)</text>
      <text x="376" y="216">● Audio:         </text><text x="520" y="216" fill="#3fb950">cpal (default input)</text>
      <text x="376" y="240">● Filtro:        </text><text x="520" y="240" fill="#d2a8ff">Normal (-40 dB / RMS 0.5)</text>
      <text x="376" y="264">● Obsidian:      </text><text x="520" y="264" fill="#3fb950">~/Obsidian/Clases/</text>
      <text x="376" y="288">● GPU:           </text><text x="520" y="288" fill="#3fb950">RTX 3050 4GB ✓</text>
    </g>
    
    <!-- Recording panel (right-bottom) - active recording view -->
    <rect x="360" y="368" width="624" height="240" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="376" y="394" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#e6edf3">GRABANDO — Cálculo II: Límites laterales</text>
    
    <!-- Waveform visualization -->
    <rect x="376" y="410" width="592" height="80" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
    <g stroke="#58a6ff" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="400" y1="450" x2="400" y2="440"/>
      <line x1="415" y1="450" x2="415" y2="430"/>
      <line x1="430" y1="450" x2="430" y2="445"/>
      <line x1="445" y1="450" x2="445" y2="425"/>
      <line x1="460" y1="450" x2="460" y2="435"/>
      <line x1="475" y1="450" x2="475" y2="450"/>
      <line x1="490" y1="450" x2="490" y2="420"/>
      <line x1="505" y1="450" x2="505" y2="440"/>
      <line x1="520" y1="450" x2="520" y2="430"/>
      <line x1="535" y1="450" x2="535" y2="445"/>
      <line x1="550" y1="450" x2="550" y2="425"/>
      <line x1="565" y1="450" x2="565" y2="435"/>
      <line x1="580" y1="450" x2="580" y2="450"/>
      <line x1="595" y1="450" x2="595" y2="420"/>
      <line x1="610" y1="450" x2="610" y2="440"/>
      <line x1="625" y1="450" x2="625" y2="430"/>
      <line x1="640" y1="450" x2="640" y2="445"/>
      <line x1="655" y1="450" x2="655" y2="425"/>
      <line x1="670" y1="450" x2="670" y2="435"/>
      <line x1="685" y1="450" x2="685" y2="450"/>
      <line x1="700" y1="450" x2="700" y2="420"/>
      <line x1="715" y1="450" x2="715" y2="440"/>
      <line x1="730" y1="450" x2="730" y2="430"/>
      <line x1="745" y1="450" x2="745" y2="445"/>
      <line x1="760" y1="450" x2="760" y2="425"/>
      <line x1="775" y1="450" x2="775" y2="435"/>
      <line x1="790" y1="450" x2="790" y2="450"/>
      <line x1="805" y1="450" x2="805" y2="420"/>
      <line x1="820" y1="450" x2="820" y2="440"/>
      <line x1="835" y1="450" x2="835" y2="430"/>
      <line x1="850" y1="450" x2="850" y2="445"/>
      <line x1="865" y1="450" x2="865" y2="425"/>
      <line x1="880" y1="450" x2="880" y2="435"/>
      <line x1="895" y1="450" x2="895" y2="450"/>
      <line x1="910" y1="450" x2="910" y2="420"/>
      <line x1="925" y1="450" x2="925" y2="440"/>
    </g>
    
    <!-- Recording info -->
    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12">
      <text x="376" y="510" fill="#e6edf3">Duración: </text><text x="470" y="510" fill="#ff7b72" font-weight="600">03:42.15</text>
      <text x="580" y="510" fill="#e6edf3">Muestras: </text><text x="670" y="510" fill="#e6edf3">3.5 MB</text>
      <text x="780" y="510" fill="#e6edf3">Nivel: </text><text x="830" y="510" fill="#d2a8ff">■■■■□□□□□□ -18 dB</text>
    </g>
    
    <text x="376" y="536" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Espacio = Pausar  ·  Enter = Detener  ·  Esc = Cancelar</text>
  </g>
  
  <!-- Bottom status line -->
  <text x="600" y="750" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#484f58">100% Local  ·  Sin telemetría  ·  MIT License  ·  github.com/JmiguelRamriez/clase-notes</text>
</svg>